    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <style>
        .banGdream-font {
            font-size: 60px;
            font-family: "Softsoul", sans-serif;
            color: #E5004F;
            -webkit-text-stroke-width: 1px;
            -webkit-text-stroke-color: white;
        }
        img {
            border-radius: 20px;
            width: 100%;
            margin: 0 auto;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        img:hover {transform: scale(1.2);}
        .gallery {
            display: grid;
            align-content: center;
            gap: 30px;
        }
        .gallery.clothes {grid-template-columns: repeat(3, 1fr);}
        .gallery.clothes img {height: 550px;}
        .gallery.wallpapers {grid-template-columns: repeat(2, 1fr);}
        .gallery.wallpapers img {height: 300px}
    </style>
</head>
